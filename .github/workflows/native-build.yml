name: Crest native builds

on:
  push:
    branches: ['build/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            configure: -A x64
            binary: build/Release/crest.dll
          - platform: linux-x64
            runner: ubuntu-24.04
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release
            binary: build/crest.so
          - platform: macos-arm64
            runner: macos-15
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
            binary: build/crest.dylib
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: projecthailstone/hailstone-client
          ref: de02d45c74c920b57f874896c443c77e07fac2c8
          path: hailstone-sdk
          sparse-checkout: sdk
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure
        shell: bash
        env:
          CONFIGURE: ${{ matrix.configure }}
        run: |
          sdk_dir=$(python -c 'from pathlib import Path; print(Path("hailstone-sdk/sdk").resolve().as_posix())')
          read -r -a configure_args <<< "$CONFIGURE"
          cmake -S native -B build "${configure_args[@]}" "-DHAILSTONE_SDK_DIR=$sdk_dir"
      - name: Compile
        run: cmake --build build --config Release --parallel 4
      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Sign macOS library
        if: runner.os == 'macOS'
        env:
          CREST_BINARY: ${{ matrix.binary }}
        run: |
          codesign --force --sign - --timestamp=none "$CREST_BINARY"
          codesign --verify --strict "$CREST_BINARY"
      - name: Load library and check SDK exports
        shell: bash
        env:
          CREST_BINARY: ${{ matrix.binary }}
        run: |
          python - <<'PY'
          from ctypes import CDLL, c_uint32
          from os import environ
          from pathlib import Path

          library = CDLL(str(Path(environ["CREST_BINARY"]).resolve()))
          library.hailstone_plugin_abi.restype = c_uint32
          assert library.hailstone_plugin_abi() == 3
          for symbol in ("hailstone_plugin_set_host", "InitializePlugin", "ShutdownPlugin", "OnPulse", "OnPacket"):
              getattr(library, symbol)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
